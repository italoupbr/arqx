<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ARQX</title>
<meta name="description" content="ARQX. Rede de escritorios de arquitetura do Brasil.">
<link rel="stylesheet" href="assets/css/arqx.css">
</head>
<body>
<div id="root"></div>

<script src="assets/vendor/react.development.js"></script>
<script src="assets/vendor/react-dom.development.js"></script>
<script src="assets/vendor/babel.min.js"></script>
<script src="src/ds/arqx-design-system.js"></script>
<script src="src/site-pages.js"></script>

<!-- Componentes embutidos: o Babel busca src="" por XHR, que o navegador
     bloqueia em file://. Embutido, a página abre com duplo clique.
     A fonte continua sendo src/components e src/pages; para regerar,
     rode build_site.py. -->
<script type="text/babel">
/* global React */
const { Button } = window.ARQXDesignSystem_3ac7f8;

function NavLink({ children, active, onClick }) {
  const [h, setH] = React.useState(false);
  return (
    <a onClick={onClick} onMouseEnter={() => setH(true)} onMouseLeave={() => setH(false)}
      style={{
        fontFamily: "var(--font-structure)", textTransform: "uppercase", letterSpacing: ".14em",
        fontSize: "12px", cursor: "pointer", padding: "4px 0", position: "relative",
        color: active || h ? "var(--text-primary)" : "var(--text-muted)",
        transition: "color var(--dur-fast) var(--ease-standard)",
      }}>
      {children}
      <span style={{ position: "absolute", left: 0, bottom: -3, height: 1, width: active ? "100%" : h ? "100%" : "0%", background: "var(--accent)", transition: "width var(--dur-base) var(--ease-out)" }} />
    </a>
  );
}

/* Desktop nav mirrors the real site: Método, Projetos, Blog, Quem Somos + CTA.
   Manifesto / Lucas Galy / Contato live in the footer + mobile "Menu" sheet only. */
function Header({ current, onNavigate }) {
  const [scrolled, setScrolled] = React.useState(false);
  React.useEffect(() => {
    const el = document.querySelector("[data-scroll]") || window;
    const t = el === window ? window : el;
    const on = () => setScrolled((el === window ? window.scrollY : el.scrollTop) > 12);
    t.addEventListener("scroll", on); return () => t.removeEventListener("scroll", on);
  }, []);
  const links = [["metodo", "Método"], ["projetos", "Projetos"], ["blog", "Blog"], ["quem-somos", "Quem Somos"]];
  return (
    <header style={{
      position: "sticky", top: 0, zIndex: 50, display: "flex", alignItems: "center", justifyContent: "space-between",
      padding: "0 var(--page-gutter)", height: "76px",
      background: scrolled ? "var(--surface-overlay)" : "transparent",
      backdropFilter: scrolled ? "var(--blur-chrome)" : "none", WebkitBackdropFilter: scrolled ? "var(--blur-chrome)" : "none",
      borderBottom: `1px solid ${scrolled ? "var(--line-hairline)" : "transparent"}`,
      transition: "background var(--dur-base), border-color var(--dur-base)",
    }}>
      <a onClick={() => onNavigate("home")} className="arqx-display" style={{ fontSize: "24px", color: "var(--text-primary)", cursor: "pointer" }}>
        arqx<sup style={{ fontSize: ".55em" }}>&reg;</sup>
      </a>
      <nav style={{ display: "none", gap: "34px", alignItems: "center" }} className="arqx-desktop-nav">
        {links.map(([k, l]) => <NavLink key={k} active={current === k} onClick={() => onNavigate(k)}>{l}</NavLink>)}
      </nav>
      <span style={{ display: "none" }} className="arqx-desktop-cta">
        <Button size="sm" variant="primary" onClick={() => onNavigate("franquia")}>Quero uma Franquia</Button>
      </span>
      <style>{`@media(min-width:860px){.arqx-desktop-nav{display:flex !important}.arqx-desktop-cta{display:inline-flex !important}}`}</style>
    </header>
  );
}
Object.assign(window, { Header });
</script>
<script type="text/babel">
/* global React */
const { Divider, ConfirmTag } = window.ARQXDesignSystem_3ac7f8;

/* Footer mirrors the real site's two columns exactly:
   Sistema -> Método, Projetos, Franquia, Blog
   Empresa -> Quem Somos, Lucas Galy, Manifesto, Contato */
function Footer({ onNavigate }) {
  return (
    <footer style={{ borderTop: "1px solid var(--line-soft)", background: "var(--bg-sunken)", padding: "var(--space-16) var(--page-gutter) var(--space-10)" }}>
      <div style={{ display: "grid", gridTemplateColumns: "1.4fr 1fr 1fr", gap: "40px", alignItems: "start" }}>
        <div>
          <div className="arqx-display" style={{ fontSize: "21px", marginBottom: "12px" }}>arqx<sup style={{ fontSize: ".55em" }}>&reg;</sup></div>
          <p style={{ color: "var(--text-muted)", fontSize: "13px", lineHeight: 1.6, maxWidth: "280px" }}>
            O primeiro sistema de franquias para arquitetos do Brasil.<ConfirmTag>CONFIRMAR alegação</ConfirmTag>
          </p>
        </div>
        <FooterCol title="Sistema" items={[["O Método","metodo"],["Projetos","projetos"],["Franquia","franquia"],["Blog","blog"]]} onNavigate={onNavigate} />
        <FooterCol title="Empresa" items={[["Quem Somos","quem-somos"],["Lucas Galy","lucas-galy"],["Manifesto","manifesto"],["Contato","contato"]]} onNavigate={onNavigate} />
      </div>
      <Divider style={{ margin: "var(--space-12) 0 var(--space-6)" }} />
      <div style={{ display: "flex", flexWrap: "wrap", justifyContent: "space-between", gap: "8px", color: "var(--text-muted)", fontSize: "12px" }}>
        <span>© 2026 ARQX. Todos os direitos reservados.<ConfirmTag>CONFIRMAR nome legal / CNPJ</ConfirmTag></span>
        <span style={{ fontFamily: "var(--font-display)", fontStyle: "italic" }}>a junção da arquitetura e do dinheiro</span>
      </div>
    </footer>
  );
}
function FooterCol({ title, items, onNavigate }) {
  return (
    <div>
      <div className="arqx-label" style={{ marginBottom: "14px" }}>{title}</div>
      <div style={{ display: "flex", flexDirection: "column", gap: "10px" }}>
        {items.map(([l, k], i) => (
          <a key={i} onClick={() => onNavigate(k)} style={{ fontSize: "14px", color: "var(--text-secondary)", cursor: "pointer" }}>{l}</a>
        ))}
      </div>
    </div>
  );
}
Object.assign(window, { Footer });
</script>
<script type="text/babel">
/* global React */
/* Mobile-only bottom tab bar, per the real site spec:
   5 fixed items — Início, Método, Projetos, Franquia (elevated CTA), Menu (opens bottom sheet
   with Blog, Quem Somos, Lucas Galy, Manifesto, Contato). <860px only, safe-area aware. */
const IconHome = () => <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.8" width="20" height="20"><path d="M3 11l9-8 9 8"/><path d="M5 10v10h14V10"/></svg>;
const IconMetodo = () => <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.8" width="20" height="20"><path d="M12 3l9 5-9 5-9-5 9-5z"/><path d="M3 13l9 5 9-5"/></svg>;
const IconGrid = () => <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.8" width="20" height="20"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/></svg>;
const IconStar = () => <svg viewBox="0 0 24 24" fill="currentColor" width="18" height="18"><path d="M12 2l2.9 6.6L22 9.3l-5 4.9 1.2 7-6.2-3.6L5.8 21.2 7 14.2 2 9.3l7.1-.7L12 2z"/></svg>;
const IconDots = () => <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.8" width="20" height="20"><circle cx="5" cy="12" r="1.4" fill="currentColor" stroke="none"/><circle cx="12" cy="12" r="1.4" fill="currentColor" stroke="none"/><circle cx="19" cy="12" r="1.4" fill="currentColor" stroke="none"/></svg>;

function TabItem({ active, onClick, icon, label }) {
  return (
    <a onClick={onClick} style={{
      flex: 1, display: "flex", flexDirection: "column", alignItems: "center", justifyContent: "center",
      gap: "4px", minHeight: "56px", cursor: "pointer",
      color: active ? "var(--text-primary)" : "var(--text-muted)", fontSize: "10.5px", fontWeight: 600,
    }}>
      {icon}<span>{label}</span>
    </a>
  );
}

function MobileNav({ current, onNavigate }) {
  const [open, setOpen] = React.useState(false);
  const secondary = [["blog","Blog"],["quem-somos","Quem Somos"],["lucas-galy","Lucas Galy"],["manifesto","Manifesto"],["contato","Contato"]];
  return (
    <>
      <nav className="arqx-mobile-nav" style={{
        position: "fixed", left: 0, right: 0, bottom: 0, zIndex: 80, display: "flex",
        background: "rgba(10,9,8,.96)", backdropFilter: "var(--blur-chrome)",
        borderTop: "1px solid var(--line-soft)", paddingBottom: "env(safe-area-inset-bottom)",
      }}>
        <TabItem active={current === "home"} onClick={() => onNavigate("home")} icon={<IconHome/>} label="Início" />
        <TabItem active={current === "metodo"} onClick={() => onNavigate("metodo")} icon={<IconMetodo/>} label="Método" />
        <TabItem active={current === "projetos"} onClick={() => onNavigate("projetos")} icon={<IconGrid/>} label="Projetos" />
        <a onClick={() => onNavigate("franquia")} style={{ flex: 1, display: "flex", flexDirection: "column", alignItems: "center", justifyContent: "center", gap: "2px", minHeight: "56px", cursor: "pointer", color: "var(--stone-900)", fontSize: "10.5px", fontWeight: 600 }}>
          <span style={{ width: 34, height: 34, borderRadius: "50%", background: "var(--stone-050)", display: "flex", alignItems: "center", justifyContent: "center", marginBottom: "2px" }}><IconStar/></span>
          <span style={{ color: current === "franquia" ? "var(--text-primary)" : "var(--text-muted)" }}>Franquia</span>
        </a>
        <button type="button" onClick={() => setOpen(true)} style={{
          flex: 1, display: "flex", flexDirection: "column", alignItems: "center", justifyContent: "center",
          gap: "4px", minHeight: "56px", background: "none", border: "none", color: "var(--text-muted)", fontSize: "10.5px", fontWeight: 600,
        }}><IconDots/><span>Menu</span></button>
      </nav>
      <style>{`@media(min-width:860px){.arqx-mobile-nav{display:none !important}}body{padding-bottom:76px}@media(min-width:860px){body{padding-bottom:0}}`}</style>
      {open && (
        <div onClick={(e) => { if (e.target === e.currentTarget) setOpen(false); }} style={{ position: "fixed", inset: 0, zIndex: 90, background: "rgba(0,0,0,.6)" }}>
          <div style={{ position: "absolute", left: 0, right: 0, bottom: 0, background: "var(--surface-card)", borderTop: "1px solid var(--line-soft)", borderRadius: "16px 16px 0 0", padding: "24px", paddingBottom: "calc(24px + env(safe-area-inset-bottom))" }}>
            <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: "18px" }}>
              <strong className="arqx-label">Menu</strong>
              <button type="button" onClick={() => setOpen(false)} style={{ background: "none", border: "none", color: "var(--text-primary)", fontSize: "22px" }}>&times;</button>
            </div>
            {secondary.map(([k, l], i) => (
              <a key={k} onClick={() => { setOpen(false); onNavigate(k); }} style={{
                display: "block", padding: "14px 4px", fontSize: "16px", fontWeight: 700,
                borderBottom: i < secondary.length - 1 ? "1px solid var(--line-soft)" : "none", color: "var(--text-primary)", cursor: "pointer",
              }}>{l}</a>
            ))}
          </div>
        </div>
      )}
    </>
  );
}
Object.assign(window, { MobileNav });
</script>
<script type="text/babel">
/* global React */
const { Eyebrow, Button, StatBlock, PullQuote, Card, ConfirmTag } = window.ARQXDesignSystem_3ac7f8;
const Arrow = () => <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="M5 12h14M13 6l6 6-6 6"/></svg>;

function Home({ onNavigate }) {
  const why = [
    ["01", "Curadoria de fundador com resultado provado", "Lucas Galy atuou diretamente na geração de mais de R$10 milhões em projetos fechados online antes de estruturar o sistema. Não é curso gravado, é direção estratégica ativa."],
    ["02", "Foco em estruturação comercial, não em RT ou perícia", "Outras franquias do setor misturam arquitetura com engenharia civil, inspeção predial e laudos. A ARQX é construída em torno de um único problema: transformar talento técnico em negócio lucrativo."],
    ["03", "Quatro pilares, não um pacote genérico", "Posicionamento, captação, gestão e previsibilidade financeira entregues como sistema, não como itens avulsos de um enxoval padrão."],
  ];
  return (
    <div>
      <section style={{ position: "relative", minHeight: "82vh", display: "flex", alignItems: "flex-end",
        padding: "0 var(--page-gutter) var(--space-24)", overflow: "hidden" }}>
        <img src={window.__resources.imgInterior} alt=""
          style={{ position: "absolute", inset: 0, width: "100%", height: "100%", objectFit: "cover", opacity: 0.9 }} />
        <div style={{ position: "absolute", inset: 0, background: "linear-gradient(180deg, rgba(10,9,8,.55) 0%, rgba(10,9,8,.2) 40%, rgba(10,9,8,.92) 100%)" }} />
        <div style={{ position: "relative", maxWidth: "980px" }}>
          <Eyebrow>O primeiro sistema de franquias para arquitetos do Brasil<ConfirmTag>CONFIRMAR, ver Achado 2 do planejamento</ConfirmTag></Eyebrow>
          <h1 className="arqx-display" style={{ fontSize: "clamp(52px,9vw,124px)", lineHeight: 0.98, margin: "22px 0 0", color: "var(--text-primary)" }}>
            arquitetura<br/>lucrativa.
          </h1>
          <p style={{ fontSize: "18px", lineHeight: 1.6, color: "var(--text-secondary)", maxWidth: "54ch", marginTop: "28px" }}>
            A ARQX transforma arquitetos em empresários de alta performance. Você projeta, cria e constrói, nós cuidamos de tudo o que a faculdade nunca ensinou.
          </p>
          <div style={{ display: "flex", gap: "14px", marginTop: "36px", flexWrap: "wrap" }}>
            <Button size="lg" variant="primary" iconRight={<Arrow/>} onClick={() => onNavigate("franquia")}>Quero uma Franquia</Button>
            <Button size="lg" variant="secondary" onClick={() => onNavigate("metodo")}>Conhecer o Método</Button>
          </div>
        </div>
      </section>

      <section style={{ borderTop: "1px solid var(--line-soft)", borderBottom: "1px solid var(--line-soft)",
        padding: "var(--space-16) var(--page-gutter)", display: "grid", gridTemplateColumns: "repeat(4,1fr)", gap: "32px" }}>
        <StatBlock value="+120" label={<>arquitetos no sistema<ConfirmTag>CONFIRMAR</ConfirmTag></>} />
        <StatBlock prefix="R$" value="1.2M" label="faturamento médio anual dos franqueados" />
        <StatBlock value="3.4x" label="crescimento médio de faturamento em 12 meses" />
        <StatBlock value="14" label="estados com unidades ativas no Brasil" />
      </section>

      <section style={{ padding: "var(--space-24) var(--page-gutter)" }}>
        <Eyebrow>O Sistema</Eyebrow>
        <p className="arqx-display" style={{ fontSize: "clamp(28px,3.2vw,46px)", margin: "18px 0 0" }}>a junção da arquitetura e do dinheiro.</p>
        <p style={{ fontSize: "16px", lineHeight: 1.7, color: "var(--text-secondary)", marginTop: "22px", maxWidth: "72ch" }}>
          O modelo combina um enxoval completo de entrada com suporte contínuo de uma equipe especializada e a curadoria estratégica de Lucas Galy. Captação de clientes, gestão de marketing, processos internos e previsibilidade financeira, tudo em um só lugar.
        </p>
        <div style={{ marginTop: "26px" }}>
          <Button variant="ghost" iconRight={<Arrow/>} onClick={() => onNavigate("metodo")}>Ver os Quatro Pilares</Button>
        </div>
      </section>

      <section style={{ padding: "var(--space-24) var(--page-gutter)", borderTop: "1px solid var(--line-soft)" }}>
        <Eyebrow>Por que ARQX, e não outra franquia de arquitetura</Eyebrow>
        <p style={{ fontSize: "17px", lineHeight: 1.6, color: "var(--text-secondary)", marginTop: "16px", maxWidth: "62ch" }}>
          O mercado de franquia para arquitetos já tem outros players ativos. A diferença real não está em ser franquia, está em quem estrutura ela.
        </p>
        <div style={{ display: "grid", gridTemplateColumns: "repeat(3,1fr)", gap: "20px", marginTop: "30px" }}>
          {why.map(([n, t, d]) => (
            <Card key={n}>
              <div style={{ fontFamily: "var(--font-structure)", color: "var(--text-muted)", fontSize: "13px", letterSpacing: ".05em", marginBottom: "10px" }}>{n}</div>
              <h3 style={{ fontSize: "17px", marginBottom: "8px" }}>{t}</h3>
              <p style={{ fontSize: "14px", color: "var(--text-secondary)", lineHeight: 1.6 }}>{d}</p>
            </Card>
          ))}
        </div>
      </section>

      <section style={{ padding: "var(--space-24) var(--page-gutter)", background: "var(--bg-sunken)", borderTop: "1px solid var(--line-soft)" }}>
        <div style={{ maxWidth: "980px", margin: "0 auto", textAlign: "center" }}>
          <PullQuote size="lg" cite="Lucas Galy" role="Fundador da ARQX">
            o arquiteto brilhante que quebra é o retrato de um mercado que ensina tudo, menos a lucrar.
          </PullQuote>
        </div>
      </section>

      <section style={{ padding: "var(--space-24) var(--page-gutter)" }}>
        <Eyebrow>Portfólio da rede</Eyebrow>
        <p className="arqx-display" style={{ fontSize: "clamp(28px,3.2vw,44px)", margin: "16px 0 26px" }}>projetos que também dão lucro.</p>
        <div style={{ display: "grid", gridTemplateColumns: "repeat(3,1fr)", gap: "20px" }}>
          <Card image={window.__resources.imgProjectsGrid} eyebrow="Residencial" interactive>
            <h3 style={{ fontSize: "17px" }}>Residência Itaim</h3>
            <p style={{ fontSize: "13px", color: "var(--text-muted)", marginTop: "6px" }}>Unidade ARQX · São Paulo</p>
          </Card>
          <Card image={window.__resources.imgPortrait} eyebrow="Corporativo" interactive>
            <h3 style={{ fontSize: "17px" }}>Escritório Faria Lima</h3>
            <p style={{ fontSize: "13px", color: "var(--text-muted)", marginTop: "6px" }}>Unidade ARQX · São Paulo</p>
          </Card>
          <Card image={window.__resources.imgArquitetura} eyebrow="Arquitetura" interactive>
            <h3 style={{ fontSize: "17px" }}>Casa Serra</h3>
            <p style={{ fontSize: "13px", color: "var(--text-muted)", marginTop: "6px" }}>Unidade ARQX · São Paulo</p>
          </Card>
        </div>
        <div style={{ marginTop: "24px" }}><Button variant="secondary" onClick={() => onNavigate("projetos")}>Ver portfólio completo</Button></div>
      </section>

      <section style={{ padding: "var(--space-20) var(--page-gutter) var(--space-24)", borderTop: "1px solid var(--line-soft)", textAlign: "center" }}>
        <h2 className="arqx-display" style={{ fontSize: "clamp(26px,3vw,38px)", marginBottom: "22px" }}>Pronto para transformar talento técnico em negócio lucrativo?</h2>
        <Button size="lg" variant="primary" onClick={() => onNavigate("franquia")}>Quero uma Franquia</Button>
      </section>
    </div>
  );
}
Object.assign(window, { Home });
</script>

<script type="text/babel">
const SLUG = window.currentPageSlug();
const go = window.ARQX_NAV;

function Page() {
  const { Header, Footer, MobileNav, Home } = window;
  return (
    <React.Fragment>
      <Header current={SLUG} onNavigate={go} />
      <Home onNavigate={go} />
      <Footer onNavigate={go} />
      <MobileNav current={SLUG} onNavigate={go} />
    </React.Fragment>
  );
}

/* Babel transpila os scripts em ordem, mas o mount espera de qualquer
   forma: e barato e cobre o caso de um arquivo demorar mais para chegar. */
(function mount() {
  const faltando = ["Header", "Footer", "MobileNav", "Home"]
    .filter((k) => !window[k]);
  if (faltando.length) return setTimeout(mount, 40);
  ReactDOM.createRoot(document.getElementById("root")).render(<Page />);
})();
</script>
</body>
</html>
